name: iOS unsigned IPA (sideload)

# Builds an UNSIGNED .ipa of Wisp that a free-Apple-ID sideloader (SideStore,
# AltStore, Sideloadly…) can re-sign on-device. No paid Apple Developer account
# and no Mac required — the build runs on a GitHub-hosted macOS runner.
#
# Manual trigger only (workflow_dispatch) so it never burns CI minutes on push.
# Run it from the GitHub UI → Actions → "iOS unsigned IPA (sideload)" → Run
# workflow, then download the "wisp-unsigned-ipa" artifact when it finishes.
#
# Full how-to + SideStore setup: docs/SIDELOADING.md

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # RN 0.81 / Expo SDK 54 needs a recent Xcode (16+).
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # Managed app: /ios is gitignored, so generate the native project fresh.
      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      # Plain `build` (not `archive`) with signing disabled → a bare .app we can
      # package ourselves. The workspace/scheme are auto-detected so this keeps
      # working even if the app is ever renamed.
      - name: Build (Release, no code signing)
        run: |
          set -eo pipefail
          WORKSPACE=$(ls ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      # An .ipa is just a zip with the .app inside a top-level Payload/ folder.
      - name: Package unsigned .ipa
        run: |
          set -eo pipefail
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          echo "App bundle: $APP"
          rm -rf Payload Wisp-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Wisp-unsigned.ipa Payload
          ls -lh Wisp-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisp-unsigned-ipa
          path: Wisp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
